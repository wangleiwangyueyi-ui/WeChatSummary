name: Validate source
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python -m unittest test_distribution -v
      - run: python -m compileall -q -x 'bootstrap' .
